name: Route2Zero 2.0 CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Pipeline contracts and Netlify build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Route2Zero 2.0 contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Check operational source freshness
        run: python scripts/check_source_freshness.py

      - name: Verify Netlify production build
        working-directory: netlify-site
        env:
          MAPBOX_TOKEN: pk.test-ci-public-token
        run: npm run build
