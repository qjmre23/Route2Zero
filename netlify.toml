[build]
  base = "netlify-site"
  command = "npm run build"
  publish = "public"

[build.environment]
  # public/config.js intentionally contains a browser-safe Mapbox pk token.
  SECRETS_SCAN_OMIT_PATHS = "netlify-site/public/config.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
